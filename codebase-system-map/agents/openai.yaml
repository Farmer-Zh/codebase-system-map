interface:
  display_name: "Codebase System Map"
  short_description: "Conversationally shape a system map from a repository"
  default_prompt: "Use $codebase-system-map to design and generate a standalone HTML map of this repository. Infer what to emphasize or simplify from my request, and let me refine the result through follow-up conversation."
